name: Release

# Publishes a GitHub Release whenever the number in VERSION changes on main
# (or when run by hand from the Actions tab). The sketch and the Python script
# are attached, plus a zip of the whole project.
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.exists == 'false'
        uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:mega
          sketch-paths: face_fan_mega
          libraries: |
            - name: Servo
      - if: steps.check.outputs.exists == 'false'
        name: Pack the project
        run: |
          name="face-fan-mega-v${{ steps.v.outputs.version }}"
          mkdir -p "dist/$name"
          cp -r face_fan_mega face_fan.py requirements.txt wiring README.md LICENSE VERSION CHANGELOG.md "dist/$name/"
          (cd dist && zip -qr "$name.zip" "$name")
      - if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
            face_fan_mega/face_fan_mega.ino
            face_fan.py
          generate_release_notes: true
